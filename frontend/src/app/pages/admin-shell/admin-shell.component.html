<section class="dash">
  <aside class="rail">
    <p class="kicker">Admin panel</p>
    <p class="rail-mark">SR</p>
    <h1>{{ appName }}</h1>
    <p class="signed">Signed in as {{ email() }}</p>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Overview</a>
      <a routerLink="/dashboard/slider" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home slider</a>
      <a routerLink="/dashboard/slider/view" routerLinkActive="active">View slides</a>
      <a routerLink="/dashboard/slider/add" routerLinkActive="active">Add slide</a>
      <a routerLink="/dashboard/header" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Header links</a>
      <a routerLink="/dashboard/header/view" routerLinkActive="active">View links</a>
      <a routerLink="/dashboard/header/add" routerLinkActive="active">Add link</a>
      <a routerLink="/dashboard/registrations" routerLinkActive="active">Registrations</a>
      <a routerLink="/equipment">Equipment</a>
      <a routerLink="/contact">Enquiries</a>
      <a routerLink="/">Public site</a>
    </nav>
    <button class="btn ghost" type="button" (click)="signOut()">Sign out</button>
  </aside>
  <div class="board">
    <router-outlet />
  </div>
</section>
